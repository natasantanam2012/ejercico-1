<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Estructura Semántica Completa</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>Mi Sitio Web Semántico</h1>
    </header>

    <main>
        <section>
            <h2>Sección de Noticias</h2>
            <p>Este es un texto dentro de una etiqueta 'p' (párrafo).</p>

            <article>
                <h3>Entrada del Blog</h3>
                <p>Este es el cuerpo de un artículo independiente.</p>
            </article>
        </section>

        <aside>
            <h3>Barra Lateral</h3>
            <p>Contenido extra que complementa la información principal.</p>
        </aside>
    </main>

    <footer>
        <p>Creado mediante Terminal - 2026</p>
    </footer>

</body>
</html>
